# main push 시 빌드 결과를 S3에 올리고 CloudFront 캐시를 무효화한다 (M4-12).
# AWS 자격 증명은 키 없이 GitHub OIDC로 받는다. 값은 저장소 Variables에서 읽는다.
name: deploy-aws

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE: /api
          VITE_USE_MOCK: "false"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      # 해시가 붙은 정적 파일은 오래 캐시한다.
      - name: Upload assets
        run: |
          aws s3 sync dist/assets "s3://${{ vars.FRONTEND_BUCKET }}/assets" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      # index.html 등 나머지는 캐시하지 않는다. 새 배포가 바로 보이게 한다.
      - name: Upload the rest
        run: |
          aws s3 sync dist "s3://${{ vars.FRONTEND_BUCKET }}" \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.FRONTEND_DISTRIBUTION_ID }}" \
            --paths "/*"