# PR: 린트·빌드 / develop·main push: 린트·빌드 후 이미지를 GHCR에 올린다 (태그 = 커밋 SHA)
# 이미지 주소: ghcr.io/<owner>/<repo>:<커밋 SHA> (소문자)
name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # GHCR 이미지 이름은 소문자여야 한다
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_BASE=/api
            VITE_USE_MOCK=false
      - run: echo "이미지 ${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"